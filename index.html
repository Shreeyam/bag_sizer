<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Bag Strap Sizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: #f0f2f5;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            color: #007bff;
            font-family: monospace;
        }
        .alignment-controls {
            grid-column: 1 / -1;
            border-top: 1px solid #dee2e6;
            padding-top: 15px;
            margin-top: 5px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            justify-content: center;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }
        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            background: white;
            display: block;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Messenger Bag Strap Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Bag Length (L) <span id="val-L" class="value-display">40 cm</span></label>
                <input type="range" id="input-L" min="10" max="100" value="40" step="1">
            </div>
            <div class="control-group">
                <label>Bag Height (h) <span id="val-h" class="value-display">30 cm</span></label>
                <input type="range" id="input-h" min="10" max="80" value="30" step="1">
            </div>
            <div class="control-group">
                <label>Strap Width (w) <span id="val-w" class="value-display">5 cm</span></label>
                <input type="range" id="input-w" min="1" max="20" value="5" step="0.5">
            </div>
            <div class="control-group">
                <label>Datum Offset (% of L from center) <span id="val-d" class="value-display">25% (10 cm)</span></label>
                <input type="range" id="input-d" min="0" max="50" value="25" step="1">
            </div>
            
            <div class="alignment-controls">
                <div style="text-align: center; font-weight: 600; margin-bottom: 5px;">Strap Alignment relative to Datum Line</div>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="align" value="inside"> 
                        Inside (Towards Center)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="align" value="middle" checked> 
                        Middle (Centered)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="align" value="outside"> 
                        Outside (Away from Center)
                    </label>
                </div>
            </div>
        </div>

        <canvas id="canvas" width="800" height="500"></canvas>
        
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: #e3f2fd; border: 1px solid #2196f3;"></div> Bag Body</div>
            <div class="legend-item"><div class="color-box" style="background: #795548;"></div> Straps</div>
            <div class="legend-item"><div class="color-box" style="background: #ff1744;"></div> Datum Lines</div>
            <div class="legend-item"><div class="color-box" style="border: 1px dashed #999;"></div> Center Line</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const inputs = {
            L: document.getElementById('input-L'),
            h: document.getElementById('input-h'),
            w: document.getElementById('input-w'),
            d: document.getElementById('input-d'),
            align: document.getElementsByName('align')
        };

        const displays = {
            L: document.getElementById('val-L'),
            h: document.getElementById('val-h'),
            w: document.getElementById('val-w'),
            d: document.getElementById('val-d')
        };

        function getAlignment() {
            for (const radio of inputs.align) {
                if (radio.checked) return radio.value;
            }
            return 'middle';
        }

        function draw() {
            const L = parseFloat(inputs.L.value);
            const h = parseFloat(inputs.h.value);
            const w = parseFloat(inputs.w.value);
            const d_percent = parseFloat(inputs.d.value);
            const d = (d_percent / 100) * L;
            const align = getAlignment();

            // Update displays
            displays.L.textContent = L + ' cm';
            displays.h.textContent = h + ' cm';
            displays.w.textContent = w + ' cm';
            displays.d.textContent = `${d_percent}% (${d.toFixed(1)} cm)`;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calculate scale to fit in canvas with padding
            const padding = 60;
            const availWidth = canvas.width - (padding * 2);
            const availHeight = canvas.height - (padding * 2);
            
            // We need to account for straps potentially sticking out if L is small and d is large
            // But usually bag L defines the bounds. Let's scale based on L and h primarily, 
            // but ensure we don't draw off screen if d is huge.
            // Actually, let's just scale to the bag for now, and if straps go out, they go out.
            // Better: Scale based on max(L, 2*d + w).
            const totalWidth = Math.max(L, (d * 2) + w * 2); 
            
            const scaleX = availWidth / totalWidth;
            const scaleY = availHeight / h;
            const scale = Math.min(scaleX, scaleY);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Draw Bag
            const bagW = L * scale;
            const bagH = h * scale;
            const bagX = cx - bagW / 2;
            const bagY = cy - bagH / 2;

            ctx.fillStyle = '#e3f2fd';
            ctx.strokeStyle = '#2196f3';
            ctx.lineWidth = 2;
            ctx.fillRect(bagX, bagY, bagW, bagH);
            ctx.strokeRect(bagX, bagY, bagW, bagH);

            // Draw Center Line
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = '#999';
            ctx.moveTo(cx, bagY - 20);
            ctx.lineTo(cx, bagY + bagH + 20);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Datum Lines
            const datumOffsetPx = d * scale;
            const datumLeftX = cx - datumOffsetPx;
            const datumRightX = cx + datumOffsetPx;

            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 1;
            
            // Left Datum
            ctx.beginPath();
            ctx.moveTo(datumLeftX, bagY - 10);
            ctx.lineTo(datumLeftX, bagY + bagH + 10);
            ctx.stroke();

            // Right Datum
            ctx.beginPath();
            ctx.moveTo(datumRightX, bagY - 10);
            ctx.lineTo(datumRightX, bagY + bagH + 10);
            ctx.stroke();

            // Draw Straps
            const strapW = w * scale;
            // Straps usually go full height of the bag or extend? Let's draw them full height of bag.
            const strapH = bagH; 
            const strapY = bagY;

            ctx.fillStyle = 'rgba(121, 85, 72, 0.8)'; // Brown
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 2;

            const drawStrap = (datumX, isLeft) => {
                let strapX;
                if (align === 'inside') {
                    // Inside: towards center
                    // If Left Datum: Inside is Right (datumX)
                    // If Right Datum: Inside is Left (datumX - w)
                    strapX = isLeft ? datumX : datumX - strapW;
                } else if (align === 'outside') {
                    // Outside: away from center
                    // If Left Datum: Outside is Left (datumX - w)
                    // If Right Datum: Outside is Right (datumX)
                    strapX = isLeft ? datumX - strapW : datumX;
                } else {
                    // Middle
                    strapX = datumX - strapW / 2;
                }
                
                ctx.fillRect(strapX, strapY, strapW, strapH);
                ctx.strokeRect(strapX, strapY, strapW, strapH);
            };

            drawStrap(datumLeftX, true);
            drawStrap(datumRightX, false);

            // Draw Dimensions
            ctx.fillStyle = '#333';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';

            // L dimension
            ctx.beginPath();
            ctx.moveTo(bagX, bagY + bagH + 30);
            ctx.lineTo(bagX + bagW, bagY + bagH + 30);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();
            // Arrows
            // ... (simplified for now)
            ctx.fillText(`L = ${L} cm`, cx, bagY + bagH + 50);

            // h dimension
            ctx.fillText(`h = ${h} cm`, bagX - 30, cy);

            // Datum dimension
            // Draw arrow from center to right datum
            ctx.beginPath();
            ctx.moveTo(cx, bagY - 30);
            ctx.lineTo(datumRightX, bagY - 30);
            ctx.strokeStyle = '#ff1744';
            ctx.stroke();
            ctx.fillStyle = '#ff1744';
            ctx.fillText(`offset = ${d.toFixed(1)} cm`, (cx + datumRightX)/2, bagY - 40);

        }

        // Event Listeners
        Object.values(inputs).forEach(input => {
            if (input.length) { // RadioNodeList
                input.forEach(r => r.addEventListener('input', draw));
            } else {
                input.addEventListener('input', draw);
            }
        });

        // Initial draw
        draw();

        // Handle window resize
        window.addEventListener('resize', draw);
    </script>
</body>
</html>
